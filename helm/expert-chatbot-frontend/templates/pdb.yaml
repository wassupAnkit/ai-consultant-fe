{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "expert-chatbot-frontend.fullname" . }}-pdb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "expert-chatbot-frontend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Values.app }}
{{- end }}
