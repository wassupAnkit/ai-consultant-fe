# Chart defaults. Safe to render anywhere: ingress and external secrets are off
# until an environment overlay (values-prod.yaml) turns them on.
app: expert-chatbot-frontend
namespace: production
environment: prod
replicaCount: 1
port: 3000

repository:
  image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-southeast-2.amazonaws.com
  name: expert-chatbot-frontend-prod
  tag: REPLACED_BY_CI
  pullPolicy: IfNotPresent

service:
  name: expert-chatbot-frontend-service
  port: 3000
  type: ClusterIP

dnsName: edge.heubertapp.com

ingress:
  enabled: false
  className: alb
  annotations: {}

# Non-secret environment, rendered into the ConfigMap (plus PORT and APP_RELEASE).
# EDGE_API_KEY, SESSION_SECRET and NEXT_PUBLIC_GOOGLE_CLIENT_ID arrive via externalSecret.
config:
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  # Backend (Edge API) base URL, used server-side only (config/env.ts).
  EDGE_API_URL: https://ai-consultant.heubertapp.com

externalSecret:
  enabled: false
  name: ""

probes:
  # /health and /api/health are unauthenticated liveness endpoints; /api/health also
  # checks MongoDB / Gemini / Langfuse reachability.
  startup:
    enabled: true
    path: /api/health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    enabled: true
    path: /api/health
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /api/health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# uid of the unprivileged user baked into the image (nextjs = 1001).
securityContext:
  runAsUser: 1001

# Empty = unset. Set per environment (see values-prod.yaml).
resources: {}

pdb:
  enabled: false
  minAvailable: 1
